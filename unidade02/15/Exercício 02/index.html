<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="refeicoes.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <form> 
    
        <h1>Outros controle de formulários </h1>
        <input type="hidden" name="acao" value="atualizar">
        <input type="hidden" name="id" value="123">
        <h2>tipo Radio</h2>
        <input type="radio" id="vermelho" name="cor" value="vermelho">
        <label for="vermelho"> vermelho</label><br>

        <input type= "radio" id= "azul" name=" cor" value= "azul" checked>
        <label for="azul"> azul (Padrão)</label><br>

        <input type="radio" id="verde" name="cor" value="verde">
       <label for="verde"> verde</label><br>
       <hr>
       <h2>tipo checkbox</h2>
       <p>Selecione sua tecnologias Forvoritas</p>
       <input type= "checkbox" id="html" name="tecnologias" value="html">
       <label for="html">HTML</label>
       
       <input type="checkbox" id="css" name="tecnologias" value="js">
       <label for="js">Javascript</label>
       <hr>
        <input type="submit" value="Enviar" class="button">
        <input type="reset" value="Limpar" class="button">
 </form>
</body>
</html>
