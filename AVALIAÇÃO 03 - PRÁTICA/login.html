<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravCo - Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <a href="index.html" class="logo">TravCo</a>
        <nav>
            <ul>
                <li><a href="index.html">Ofertas</a></li>
                <li><a href="produto.html">Destinos</a></li>
                <li><a href="produto.html">Pacotes</a></li>
                <li><a href="#contato">Contato</a></li>
                <li><a href="login.html"><i class="fa-solid fa-user"></i> Login</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="form-container">
            <h2>Login</h2>
            <form action="index.html" method="get">
                <div class="form-group">
                    <input type="email" class="input-line" placeholder="Informe o seu e-mail" required>
                </div>
                <div class="form-group">
                    <input type="password" class="input-line" placeholder="Informe o seu password" required>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-dark">
                        <i class="fa-solid fa-right-to-bracket"></i> Entrar
                    </button>
                    <a href="new.html" class="btn-light">
                        <i class="fa-solid fa-user-plus"></i> Criar conta
                    </a>
                </div>
            </form>
        </div>
    </main>

    <footer id="contato">
        <div class="footer-top">
            <span class="logo">TravCo</span>
            <p>A TravCo é uma agência de viagens que oferece as melhores ofertas e pacotes para você viajar pelo mundo.</p>
            <div class="social-icons">
                <a href="#"><i class="fa-brands fa-facebook"></i></a>
                <a href="#"><i class="fa-brands fa-instagram"></i></a>
                <a href="#"><i class="fa-brands fa-twitter"></i></a>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2023 TravCo. Todos os direitos reservados.</p>
        </div>
    </footer>

</body>
</html>
